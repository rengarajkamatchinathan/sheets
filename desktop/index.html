<!doctype html>
<html lang="en" class="dark antialiased" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSA Log</title>
    <script>
      // Same as ThemeScript in the web app: apply the saved theme before first paint.
      (function(){try{var p=localStorage.getItem("dsa-theme")||"dark";var d=p==="system"?matchMedia("(prefers-color-scheme: dark)").matches:p!=="light";var r=document.documentElement;r.dataset.theme=d?"dark":"light";r.classList.toggle("dark",d);}catch(e){}})();
    </script>
  </head>
  <body class="min-h-screen bg-bg font-sans text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
